<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080d1c">
  <meta name="description" content="Countdown to 23 October 2026">
  <link rel="manifest" href="manifest.json">
  <title>23 October Countdown</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#1d2945 0%,#0b1020 45%,#05070d 100%);color:#fff;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
    .container{width:100%;max-width:1100px;padding:30px 20px;text-align:center}
    .date-title{font-size:clamp(22px,4vw,40px);font-weight:700;letter-spacing:4px;margin-bottom:12px}
    h1{font-size:clamp(40px,8vw,90px);font-weight:900;letter-spacing:6px;margin-bottom:45px;background:linear-gradient(90deg,#fff,#8ab4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
    .card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:30px 15px;backdrop-filter:blur(12px);box-shadow:0 10px 35px rgba(0,0,0,.35);transition:.25s}
    .number{font-size:clamp(42px,7vw,78px);font-weight:900;line-height:1;margin-bottom:14px}
    .label{font-size:14px;font-weight:700;letter-spacing:3px;opacity:.65}
    .pulse{animation:pulse .45s ease}@keyframes pulse{50%{transform:scale(1.035)}}
    .target{display:inline-block;padding:15px 25px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);margin-bottom:30px}
    .target-title{font-size:12px;letter-spacing:2px;opacity:.55;margin-bottom:5px}
    .target-date{font-size:18px;font-weight:700}
    button{display:block;margin:0 auto 30px;padding:12px 22px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:14px;font-weight:600}
    footer{font-size:13px;opacity:.45;letter-spacing:1px}
    .finished{font-size:clamp(28px,6vw,65px);font-weight:900;padding:60px 20px}
    @media(max-width:750px){.countdown{grid-template-columns:repeat(2,1fr);gap:15px}.card{padding:25px 10px}}
    @media(max-width:430px){.container{padding:25px 14px}.date-title{letter-spacing:2px}h1{letter-spacing:3px;margin-bottom:25px}.countdown{gap:10px}.card{border-radius:16px;padding:22px 8px}.number{font-size:42px}.label{font-size:10px;letter-spacing:2px}}
  </style>
</head>
<body>
<main class="container">
  <div class="date-title">23 OCTOBER 2026</div>
  <h1>COUNTDOWN</h1>
  <section id="countdown" class="countdown">
    <div class="card"><div id="days" class="number">00</div><div class="label">DAYS</div></div>
    <div class="card"><div id="hours" class="number">00</div><div class="label">HOURS</div></div>
    <div class="card"><div id="minutes" class="number">00</div><div class="label">MINUTES</div></div>
    <div class="card"><div id="seconds" class="number">00</div><div class="label">SECONDS</div></div>
  </section>
  <div class="target"><div class="target-title">TARGET DATE</div><div class="target-date">23 October 2026</div></div>
  <button onclick="updateCountdown()">↻ Refresh Countdown</button>
  <footer>Made for my project • Countdown to 23 October 2026</footer>
</main>
<script>
  const targetDate = new Date("October 23, 2026 00:00:00").getTime();
  let previousSecond = -1;
  function updateCountdown(){
    const difference = targetDate - Date.now();
    if(difference <= 0){
      document.getElementById("countdown").innerHTML='<div class="finished">🎉 23 OCTOBER 2026 HAS ARRIVED! 🎉</div>';
      return;
    }
    const days=Math.floor(difference/86400000);
    const hours=Math.floor(difference/3600000)%24;
    const minutes=Math.floor(difference/60000)%60;
    const seconds=Math.floor(difference/1000)%60;
    document.getElementById("days").textContent=String(days).padStart(2,"0");
    document.getElementById("hours").textContent=String(hours).padStart(2,"0");
    document.getElementById("minutes").textContent=String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent=String(seconds).padStart(2,"0");
    if(seconds!==previousSecond){
      document.querySelectorAll(".card").forEach(c=>{c.classList.remove("pulse");void c.offsetWidth;c.classList.add("pulse")});
      previousSecond=seconds;
    }
  }
  updateCountdown();
  setInterval(updateCountdown,1000);
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
</script>
</body>
</html>
